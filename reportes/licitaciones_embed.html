            font-size: 13px; font-family: inherit;

        .table-wrapper {

        td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; }

        .status-v { background: #d1fae5; color: #065f46; padding: 3px 6px; border-radius: 4px; font-size: 11px; }
        .status-c { background: #fef3c7; color: #92400e; padding: 3px 6px; border-radius: 4px; font-size: 11px; }

        let filtered = [...procesos];

        function init() {
            const insts = [...new Set(procesos.map(p => p.institucion))].sort();
            const sel = document.getElementById('institucion');
            insts.forEach(i => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                sel.appendChild(opt);
            });
            render();
        }

        function render() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            filtered.forEach((p, i) => {
                const row = document.createElement('tr');
                const status = p.estado_proceso === 'vigente' 
                    ? '<span class="status-v">✓ Vigente</span>'
                    : '<span class="status-c">⏰ Próximo</span>';
                const link = p.link 
                    ? '<a href="http://sicc.honducompras.gob.hn/HC/procesos/' + p.link + '" target="_blank" class="link">Ver</a>'
                    : '-';
                row.innerHTML = `
                    <td>${i+1}</td>
                    <td><strong>${p.expediente.trim().substring(0,25)}</strong></td>
                    <td class="desc">${p.descripcion}</td>
                    <td>${p.institucion}</td>
                    <td>${p.fecha_inicio}</td>
                    <td>${p.cierre}</td>
                    <td>${p.dias_para_cierre}</td>
                    <td>${status}</td>
                    <td>${link}</td>
                `;
                tbody.appendChild(row);
            });
            updateStats();
        }

        function updateStats() {
            document.getElementById('total').textContent = filtered.length;
            document.getElementById('vigentes').textContent = 
                filtered.filter(p => p.estado_proceso === 'vigente').length;
            document.getElementById('cierre').textContent = 
                filtered.filter(p => p.estado_proceso === 'próximo_cierre').length;
            document.getElementById('instituciones').textContent = 
                new Set(filtered.map(p => p.institucion)).size;
        }

        function applyFilters() {
            const s = document.getElementById('search').value.toLowerCase();
            const i = document.getElementById('institucion').value;
            const e = document.getElementById('estado').value;
            filtered = procesos.filter(p =>
                p.expediente.toLowerCase().includes(s) &&
                (i === '' || p.institucion === i) &&
                (e === '' || p.estado_proceso === e)
            );
            render();
        }

        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('institucion').value = '';
            document.getElementById('estado').value = '';
            filtered = [...procesos];
            render();
        }

        document.getElementById('search').addEventListener('keyup', applyFilters);
        document.getElementById('institucion').addEventListener('change', applyFilters);
        document.getElementById('estado').addEventListener('change', applyFilters);

        init();
    </script>
